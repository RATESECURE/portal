/* Host for the loan presentation engine (cs-core.js), inside the RateSecure Branch Portal.
   Protected by the same shared branch login as every other tool (config.js / requireAuth()).
   Borrower data is never stored: Save keeps it for this tab's session only, and the PDF is how you keep anything.
   Only the LO's own details and fee edits are remembered in this browser. The engine styles everything inside .csx with cs-*
   classes; this file only adds the portal header, the top bar and the modals. */
:root {
  --rs-red: #b0122e;
  --rs-red-dark: #7d0e21;
  --ink: #201f1e;
  --muted: #6b6864;
  --border: #e6e3dd;
  --font-heading: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
html,body{margin:0;background:#F2F6F5}
#cs-app{min-height:100vh}

/* ── PORTAL HEADER (matches the rest of the branch portal) ───────────── */
header.app-header { padding:20px 32px; background:#fff; border-bottom:3px solid var(--rs-red); display:flex; align-items:center; justify-content:space-between; }
.header-left { display:flex; align-items:center; gap:14px; }
.header-right { display:flex; align-items:center; gap:10px; }
.nav-link { font-size:12px; color:var(--muted); text-decoration:none; font-weight:600; font-family:var(--font-heading); }
.nav-link:hover { color:var(--rs-red); }
.logout-btn {
  background:none; border:1px solid #d8d4cc; color:var(--muted); padding:8px 16px; border-radius:6px;
  font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; cursor:pointer;
}
.logout-btn:hover { border-color:var(--rs-red); color:var(--rs-red); }
.logo-img { height:32px; width:auto; display:block; }
.brand-sub { font-size:11px; color:var(--muted); letter-spacing:.03em; margin-top:2px; font-family:var(--font-body); }

/* ── LO TOOLBAR (part of the engine's own host page) ──────────────────── */
.lo-bar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;background:var(--cs-side);border-bottom:1px solid var(--cs-line);font-size:13px}
.lo-bar .lo-brandmark{height:18px;width:auto;margin-right:2px;vertical-align:middle}
.lo-bar .who{font-weight:600;color:var(--cs-ink);margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lo-bar .who small{font-weight:400;color:var(--cs-muted);margin-left:6px}
.lo-bar .brand{font-weight:700;letter-spacing:.02em;color:var(--cs-acc);margin-right:8px}
.lo-bar button{font-size:13px}
.lo-status{color:var(--cs-muted);font-size:12px;min-width:70px;text-align:right}
.lo-status.dirty{color:var(--cs-warn)}
.ver-list{display:grid;gap:6px;margin:10px 0;max-height:60vh;overflow:auto}
.ver-item{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.ver-item button.open{text-align:left;border:1px solid var(--cs-line);background:var(--cs-field);border-radius:12px;padding:10px 12px;font-size:13px}
.ver-item button.open b{display:block;font-size:14px}
.ver-item button.open span{color:var(--cs-muted)}
.cs-f textarea{width:100%;border:1px solid var(--cs-line);background:var(--cs-field);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;min-height:64px;resize:vertical}
@media (max-width:640px){ .lo-bar .who{flex-basis:100%} }

/* RateSecure is the only fee sheet, so the lender dropdown is hidden; the edit-fees link stays. */
.csx .cs-f:has(#cs-f-sheet) > span:first-child, .csx #cs-f-sheet{display:none}
.lo-me{display:flex;gap:6px;align-items:center}
.lo-me input{border:1px solid var(--cs-line);background:var(--cs-field);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px;color:var(--cs-ink)}
.lo-me select{border:1px solid var(--cs-line);background:var(--cs-field);border-radius:8px;padding:5px 6px;font:inherit;font-size:13px;color:var(--cs-ink);max-width:170px}
.lo-me input.nm{width:150px}.lo-me input.nmls{width:104px}
@media (max-width:640px){ .lo-me{flex-basis:100%} .lo-me input.nm{flex:1} }

function updateStatus(){ const el = $('#lo-status'); if(!el) return; const d = dirty(); el.textContent = d ? 'Unsaved changes' : currentId ? 'Saved' : ''; el.classList.toggle('dirty', d); }

// ---------- save / open (this browser) ----------
function save(){
  const name = nameOf(S) || 'Untitled presentation';
  const row = {id: currentId || uid(), name, updatedAt: new Date().toISOString(), brief: C.brief(), state: JSON.parse(JSON.stringify(S))};
  LIST = [row, ...LIST.filter(r => r.id !== row.id)].slice(0, 200);
  if(sstore('list', LIST)){ currentId = row.id; savedJSON = JSON.stringify(S); renderBar(); toast('Kept for this session only. Download the PDF to keep a copy.'); }
}
function openSaved(){
  modalOpen = true;
  const m = document.createElement('div'); m.className = 'cs-modal csx'; document.body.appendChild(m);
  const draw = () => { m.innerHTML = `<div class="cs-sheet" style="max-width:640px"><div style="display:flex;justify-content:space-between;align-items:start;gap:12px">
      <div><h2 style="margin:0">This session</h2><p class="cs-hint" style="color:var(--cs-muted);margin:2px 0 0">Kept only until you close this tab. Nothing is stored on this computer or on a server.</p></div>
      <button class="cs-btn small" id="sv-x">Done</button></div>
    <div class="ver-list">${LIST.length ? LIST.map(r => `<div class="ver-item"><button class="open" data-open="${esc(r.id)}"><b>${esc(r.name)}</b><span>${esc(fmtWhen(r.updatedAt))} · ${esc(r.brief || 'No numbers yet')}</span></button>
      <span style="display:flex;gap:4px"><button class="cs-btn small ghost" data-exp="${esc(r.id)}" title="Download as a file">Export file</button><button class="cs-btn small ghost" data-del="${esc(r.id)}" title="Remove from this session">Delete</button></span></div>`).join('') : '<p class="cs-hint">Nothing saved this session.</p>'}</div>
    <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><label class="cs-btn small ghost" style="cursor:pointer">Open an exported file<input type="file" id="sv-file" accept=".json,application/json" hidden></label></div></div>`;
    $('#sv-x', m).addEventListener('click', close);
    m.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => {
      if(dirty() && !confirm('Open this one? What\'s on screen hasn\'t been saved.')) return;
      const r = LIST.find(x => x.id === b.dataset.open); S = asState(r.state); currentId = r.id; savedJSON = JSON.stringify(S); close(); renderInputs(); }));
    m.querySelectorAll('[data-exp]').forEach(b => b.addEventListener('click', () => { const r = LIST.find(x => x.id === b.dataset.exp); exportFile(r); }));
    m.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
      const r = LIST.find(x => x.id === b.dataset.del); if(!confirm(`Remove "${r.name}" from this session?`)) return;
      LIST = LIST.filter(x => x.id !== r.id); sstore('list', LIST); if(currentId === r.id){ currentId = null; renderBar(); } draw(); }));
    $('#sv-file', m).addEventListener('change', async e => {
      const f = e.target.files[0]; if(!f) return;
      try { const j = JSON.parse(await f.text()); if(j.schema !== 'loan-presentation/1' || !j.state) throw 0;
        if(dirty() && !confirm('Open this file? What\'s on screen hasn\'t been saved.')) return;
        S = asState(j.state); currentId = null; savedJSON = ''; close(); renderInputs(); toast('Opened for this session. Nothing is stored.');
      } catch(err){ toast('That isn\'t an exported presentation file.'); }
    });
  };
  const close = () => { m.remove(); modalOpen = false; };
  m.addEventListener('click', e => { if(e.target === m) close(); });
  draw();
}
function exportFile(r){
  const data = JSON.stringify({schema:'loan-presentation/1', name:r.name, savedAt:r.updatedAt, state:r.state}, null, 1);
  const url = URL.createObjectURL(new Blob([data], {type:'application/json'}));
  const a = document.createElement('a'); a.href = url; a.download = (r.name || 'presentation').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

// ---------- inputs / present ----------
const kpis = c => `
  <div class="cs-kpi"><span>Loan</span><b>${money(c.total)}</b></div>
  <div class="cs-kpi"><span>Payment</span><b>${money(c.pitia)}</b></div>
  <div class="cs-kpi"><span>${c.dscr?'DSCR':'DTI'}</span><b>${c.dscr ? (isFinite(c.dscrRatio)?c.dscrRatio.toFixed(2):'—') : pct(c.dti)}</b></div>
  <div class="cs-kpi"><span>Closing costs</span><b>${money(c.closing + c.prepaidTotal)}</b></div>
  <div class="cs-kpi"><span>${c.purchase ? 'Cash to close' : c.cashOutNet>=0 ? 'Cash to you' : 'Cash to close'}</span><b>${money(c.purchase ? c.cashToClose : Math.abs(c.cashOutNet))}</b></div>`;
function renderInputs(){
  view = 'inputs'; pres = null; S.sheetId = rsId();
  ROOT.innerHTML = `<div class="lo-bar" id="lo-bar"></div>
  <div id="cs-app"><div class="cs-wrap">
    <div class="cs-top"><div><h1>Your loan review</h1><div class="cs-sub">Built from your application. Estimates until your loan is approved.</div></div>
      <div class="cs-actions"><button class="cs-btn ghost" id="cs-b-clear">Clear</button><button class="cs-btn accent" id="cs-b-present2">Present</button></div></div>
    ${S.example ? `<div class="cs-banner"><span>These are example numbers so you can see how it works.</span><button class="cs-btn small" id="cs-b-clear2">Clear and start</button></div>` : ''}
    <div id="cs-nums"></div>
  </div></div>
  <div class="cs-live"><div class="cs-in"><span id="cs-kpis" style="display:contents"></span>
    <button class="cs-btn accent cs-go" id="cs-b-present">Present →</button></div></div>`;
  renderBar();
  C.mountInputs($('#cs-nums'), {onChange: c => { lastC.c = c; const k = $('#cs-kpis'); if(k) k.innerHTML = kpis(c); updateStatus(); }});
  const clear = () => { if(!confirm('Clear every number on this presentation?')) return; const sheetId = S.sheetId; S = blank(); S.sheetId = sheetId; renderInputs(); window.scrollTo({top:0}); };
  $('#cs-b-clear').addEventListener('click', clear); const c2 = $('#cs-b-clear2'); if(c2) c2.addEventListener('click', () => { S = blank(); renderInputs(); });
  $('#cs-b-present').addEventListener('click', () => present(0)); $('#cs-b-present2').addEventListener('click', () => present(0));
}
function present(i){
  S.sheetId = rsId(); view = 'present'; window.scrollTo({top:0});
  ROOT.innerHTML = '<div class="rs-present-shell"><div class="rs-present-logo"></div><div id="cs-app"></div></div>';
  pres = C.mountPresent($('#cs-app'), {start:i, exitLabel:'Edit numbers', paused: () => modalOpen, me: meFor(),
    onExit: () => { renderInputs(); window.scrollTo({top:0}); },
    onPdf: () => C.pdf({dl: browserDownload, me: meFor(), toast})});
}
const companyLine = () => SITE.company ? SITE.company + (SITE.companyNmls ? ' · NMLS #' + SITE.companyNmls : '') : '';
const meFor = () => ({name: SET.me.name || '', nmls: SET.me.nmls || '', phone: SET.me.phone || '', email: SET.me.email || '', company: companyLine()});
const browserDownload = {save({filename, data}){
  const url = URL.createObjectURL(new Blob([data], {type:'application/pdf'}));
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000); return Promise.resolve();
}};

// ---------- 1003 / credit import (app-import.js): read in the browser, reviewed, then applied ----------
function openImport(){
  if(!window.AppImport){ toast('The importer didn\'t load. Check that app-import.js is next to this page.'); return; }
  modalOpen = true;
  const m = document.createElement('div'); m.className = 'cs-modal csx'; document.body.appendChild(m);
  m.innerHTML = `<div class="cs-sheet" style="max-width:560px">
    <h2 style="margin:0 0 4px">Import the 1003 or credit scores</h2>
    <ul class="cs-hint" style="color:var(--cs-muted);margin:6px 0 12px 18px;padding:0">
      <li>The 1003 as <b>MISMO 3.4 XML</b> (ULAD) from your LOS. It's the most complete.</li>
      <li>The 1003 as a <b>PDF</b>. This is best effort: it picks up the main numbers, and you fill in the rest.</li>
      <li>The <b>credit report XML</b> from the soft pull. Only the scores are used.</li></ul>
    <p class="cs-hint" style="color:var(--cs-muted);margin:0 0 12px">The file is read here in your browser and never uploaded or saved. SSNs, birth dates and account numbers are never read.</p>
    <input type="file" id="im-file" accept=".xml,.pdf,text/xml,application/xml,application/pdf">
    <div id="im-out" style="margin-top:12px"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="cs-btn ghost" id="im-no">Cancel</button><button class="cs-btn primary" id="im-go" disabled>Fill in the presentation</button></div></div>`;
  const close = () => { m.remove(); modalOpen = false; };
  let res = null;
  $('#im-no', m).addEventListener('click', close);
  $('#im-file', m).addEventListener('change', async e => {
    const f = e.target.files[0]; res = null; $('#im-go', m).disabled = true; const out = $('#im-out', m);
    if(!f) return;
    if(f.size > 25e6){ out.innerHTML = '<div class="cs-note" style="color:var(--cs-warn)">That file is too large to be a 1003 or credit export.</div>'; return; }
    out.innerHTML = '<div class="cs-note">Reading…</div>';
    try {
      res = await AppImport.parseFile(f);
      const lists = ['incomes','debts','assets'].filter(k => res.patch[k] && (S[k] || []).some(x => n(x.amt)));
      $('#im-go', m).textContent = res.kind === 'credit' ? 'Add the scores' : 'Fill in the presentation';
      out.innerHTML = `<div class="cs-card" style="padding:12px"><b>${res.kind === 'credit' ? 'Credit scores from the report' : 'From the file'}</b><ul style="margin:6px 0 0 18px;padding:0">${res.summary.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
        ${res.warnings.length ? `<div class="cs-note" style="color:var(--cs-warn);margin-top:8px">${res.warnings.map(esc).join('<br>')}</div>` : ''}
        ${lists.length ? `<div class="cs-note" style="margin-top:8px">This replaces the ${lists.join(', ')} already on this presentation. Your fee sheet, closing cost entries and options stay.</div>` : ''}
        <div class="cs-note" style="margin-top:8px">Not read: ${esc(res.skipped.join(', '))}.</div></div>`;
      $('#im-go', m).disabled = false;
    } catch(err){ out.innerHTML = `<div class="cs-note" style="color:var(--cs-warn)">${esc(err.message || 'That file didn\'t read.')}</div>`; }
    e.target.value = '';   // the file isn't kept
  });
  $('#im-go', m).addEventListener('click', () => {
    if(!res) return;
    if(res.kind === 'credit'){ S.bureau = res.patch.bureau; S.score = res.patch.score; close(); renderInputs(); toast('Scores added. The credit slide now shows how the middle score works.'); return; }
    const src = S.example ? blank() : S;   // never carry the demo's numbers into a real borrower's presentation
    const keep = {sheetId:src.sheetId, feeEdits:src.feeEdits, appraisal:src.appraisal, credit:src.credit, title:src.title, other:src.other, options:src.options, emd:src.emd, sellerCredit:src.sellerCredit, lenderCredit:src.lenderCredit};
    if(S.example) S = blank();
    Object.assign(S, res.patch, keep, {example:false});
    close(); renderInputs(); toast('Filled in from the application. Check the numbers, then Save.');
  });
}

// ---------- pre-approval letter: hand the numbers to the letter tool in a new tab ----------
// Passed through a short-lived browser entry that the letter page deletes the moment it reads it (never in the URL,
// never sent to a server). If the letter tab never opens, it expires after 2 minutes.
function openLetter(){
  const c = lastC.c; if(!c || !c.loan){ toast('Add a price (or value) and loan details first, then open the letter.'); return; }
  const kind = planKind(S), term = n(S.term) || 30;
  const detail = kind === 'fha' ? term + '-Yr Fixed FHA' : kind === 'dscr' ? 'DSCR / Rental' : kind === 'nonqm' ? term + '-Yr Fixed Non-QM' : term + '-Yr Fixed Conforming';
  const typedRate = String(S.rate ?? '').trim() !== '' && !S.noRateYet && c.rate > 0;
  const hand = {t: Date.now(), b1: [S.first, S.last].filter(Boolean).join(' '), b2: S.coOn ? [S.coFirst, S.coLast].filter(Boolean).join(' ') : '',
    price: Math.round(c.value || c.price), loan: Math.round(c.loan), down: Math.max(0, Math.round((c.value || c.price) - c.loan)), ltv: c.ltv ? +(c.ltv * 100).toFixed(2) : '',
    rate: typedRate ? String(c.rate) : '', occ: {primary:'Primary', second:'Second Home', investment:'Investment'}[S.occ] || 'Primary', detail, lo: SET.me.name || ''};
  try { localStorage.setItem('rs-handoff', JSON.stringify(hand)); } catch(e){ toast('This browser blocked passing the numbers over. Open the letter tool and type them in.'); }
  window.open('preapproval.html', '_blank');
}

// ---------- follow-up email: a draft to copy, never sent from here ----------
function openEmail(){
  modalOpen = true;
  const d = C.email(meFor());
  const m = document.createElement('div'); m.className = 'cs-modal csx'; document.body.appendChild(m);
  m.innerHTML = `<div class="cs-sheet" style="max-width:680px"><div style="display:flex;justify-content:space-between;gap:12px;align-items:start">
      <div><h2 style="margin:0">Follow-up email</h2><p class="cs-hint" style="color:var(--cs-muted);margin:2px 0 0">A draft from this presentation. Edit it, then copy it into your email. Nothing is sent from this page.</p></div>
      <button class="cs-btn small" id="em-x">Done</button></div>
    <label class="cs-f" style="margin-top:12px"><span>Subject</span><input id="em-subj" value="${esc(d.subject)}"></label>
    <label class="cs-f" style="margin-top:10px"><span>Message</span><textarea id="em-body" style="min-height:340px;font-size:14px;line-height:1.45">${esc(d.body)}</textarea></label>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px">
      <button class="cs-btn small ghost" id="em-cs">Copy subject</button><button class="cs-btn small primary" id="em-cb">Copy message</button></div></div>`;
  const close = () => { m.remove(); modalOpen = false; };
  const copy = async (txt, what) => { try { await navigator.clipboard.writeText(txt); toast(what + ' copied.'); } catch(e){ toast('Select the text and copy it with Ctrl+C.'); } };
  $('#em-x', m).addEventListener('click', close); m.addEventListener('click', e => { if(e.target === m) close(); });
  $('#em-cs', m).addEventListener('click', () => copy($('#em-subj', m).value, 'Subject'));
  $('#em-cb', m).addEventListener('click', () => copy($('#em-body', m).value, 'Message'));
}

// ---------- settings: your details, planning numbers, fee sheets (all saved in this browser) ----------
let draft = null;
function openSettings(){ modalOpen = true; const s = SET.sheets.find(x => x.id === S.sheetId) || SET.sheets[0]; draft = s ? JSON.parse(JSON.stringify(s)) : null; renderSettings(); }
function closeSettings(){ const m = $('#cs-set'); if(m) m.remove(); modalOpen = false; draft = null; if(view === 'inputs') renderInputs(); }
function renderSettings(){
  let m = $('#cs-set'); if(!m){ m = document.createElement('div'); m.id = 'cs-set'; m.className = 'cs-modal csx'; document.body.appendChild(m); m.addEventListener('click', e => { if(e.target === m) closeSettings(); }); }
  m.innerHTML = `<div class="cs-sheet" role="dialog" aria-modal="true">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:start"><div><h2 style="margin:0">Your details</h2>
      <p class="cs-hint" style="color:var(--cs-muted);margin:2px 0 10px">Shown on the Thank you slide and the PDF${SITE.company ? `, with “${esc(companyLine())}”` : ''}.</p></div>
      <button class="cs-btn small" id="st-x">Done</button></div>
    <div class="cs-fields">${[['name','Your name'],['nmls','Your NMLS #'],['phone','Phone'],['email','Email']].map(([k,l]) => `<label class="cs-f"><span>${l}</span><input data-me="${k}" value="${esc(SET.me[k]||'')}"></label>`).join('')}</div>
    <hr style="border:0;border-top:1px solid var(--cs-line);margin:20px 0">
    <h2 style="margin:0">Planning numbers</h2>
    <p class="cs-hint" style="color:var(--cs-muted);margin:2px 0 10px">Used for the payment when the rate or insurance is left blank. Never shown to the borrower.</p>
    <div class="cs-fields">${PLAN_KINDS.map(([k,l]) => `<label class="cs-f"><span>${esc(l)} rate</span><span class="cs-adorn post"><input data-plan="${k}" inputmode="decimal" value="${esc(SET.rates[k] ?? '')}"><i>%</i></span></label>`).join('')}
      <label class="cs-f"><span>Insurance estimate (% of value / yr)</span><span class="cs-adorn post"><input id="pl-ins" inputmode="decimal" value="${esc(SET.insurancePct ?? '')}"><i>%</i></span></label></div>
    <hr style="border:0;border-top:1px solid var(--cs-line);margin:20px 0">
    <h2 style="margin:0">RateSecure fees</h2>
    <p class="cs-hint" style="color:var(--cs-muted);margin:2px 0 10px">These are the closing-cost fees used on every presentation; change one here and it carries to all new ones. Ticked fees show to the borrower as one “Lender fees” line they can click open.</p>
    ${draft ? `<div class="cs-fields" style="margin:12px 0">
        <label class="cs-f"><span>Name</span><input id="fm-name" value="${esc(draft.name)}"></label>
        <label class="cs-f"><span>As of</span><input id="fm-asof" value="${esc(draft.asOf||'')}" placeholder="e.g. Nov 2026"></label>
        <label class="cs-f"><span>Appraisal (typical)</span><input id="fm-appr" inputmode="decimal" value="${esc(draft.appraisal??'')}"></label>
        <label class="cs-f"><span>Credit report (per borrower)</span><input id="fm-cred" inputmode="decimal" value="${esc(draft.credit??'')}"></label></div>
      <div class="cs-rows">${(draft.fees||[]).map((f,i) => `<div class="cs-row" style="grid-template-columns:1fr 110px auto auto"><input data-fi="${i}" data-ff="label" value="${esc(f.label)}" aria-label="Fee name"><input data-fi="${i}" data-ff="amount" inputmode="decimal" value="${esc(f.amount)}" aria-label="Amount"><label class="cs-note" style="display:flex;gap:4px;align-items:center;white-space:nowrap"><input type="checkbox" data-froll="${i}" ${f.rollup?'checked':''}> Lender fees</label><button class="cs-x" data-fdel="${i}" aria-label="Remove">×</button></div>`).join('')}</div>
      <button class="cs-btn small cs-addrow" id="fm-add">+ Add fee</button>
      <label class="cs-f" style="margin-top:12px"><span>Notes</span><input id="fm-notes" value="${esc(draft.notes||'')}"></label>
      <div style="display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap">
        <span></span>
        <button class="cs-btn primary" id="fm-save">Save fees</button></div>` : ''}
    <div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="cs-btn primary" id="st-save">Save my details and planning numbers</button></div>
  </div>`;
  $('#st-x', m).addEventListener('click', closeSettings);
  $('#st-save', m).addEventListener('click', () => {
    m.querySelectorAll('[data-me]').forEach(el => SET.me[el.dataset.me] = el.value.trim());
    SET.rates = {}; m.querySelectorAll('[data-plan]').forEach(el => { if(el.value.trim()) SET.rates[el.dataset.plan] = el.value.trim(); });
    SET.insurancePct = $('#pl-ins', m).value.trim();
    if(store('settings', SET)) toast('Saved.');
  });
  if(!draft) return;
  const pull = () => { draft.name = $('#fm-name', m).value; draft.asOf = $('#fm-asof', m).value; draft.appraisal = $('#fm-appr', m).value; draft.credit = $('#fm-cred', m).value; draft.notes = $('#fm-notes', m).value;
    m.querySelectorAll('[data-fi]').forEach(el => { draft.fees[+el.dataset.fi][el.dataset.ff] = el.value; });
    m.querySelectorAll('[data-froll]').forEach(el => { draft.fees[+el.dataset.froll].rollup = el.checked; }); };
  $('#fm-add', m).addEventListener('click', () => { pull(); draft.fees.push({label:'', amount:''}); renderSettings(); });
  m.querySelectorAll('[data-fdel]').forEach(b => b.addEventListener('click', () => { pull(); draft.fees.splice(+b.dataset.fdel, 1); renderSettings(); }));
  $('#fm-save', m).addEventListener('click', () => {
    pull();
    const sheet = {id: draft.id || uid(), name: draft.name.trim() || 'Untitled fee sheet', asOf: draft.asOf || '', order: draft.order || SET.sheets.length + 1,
      appraisal: String(draft.appraisal ?? '').trim() === '' ? 0 : n(draft.appraisal), credit: String(draft.credit ?? '').trim() === '' ? 0 : n(draft.credit), notes: draft.notes || '',
      fees: draft.fees.filter(f => String(f.label).trim()).map(f => Object.assign({label:String(f.label).trim(), amount:n(f.amount)}, f.rollup ? {rollup:true} : {}))};
    SET.sheets = draft._new ? [...SET.sheets, sheet] : SET.sheets.map(s => s.id === sheet.id ? sheet : s);
    SET.sheetsEdited = true;
    if(store('settings', SET)){ draft = JSON.parse(JSON.stringify(sheet)); toast('RateSecure fees saved.'); renderSettings(); }
  });
  const del = $('#fm-del', m); if(del) del.addEventListener('click', () => {
    if(!confirm(`Delete the "${draft.name}" fee sheet from this browser?`)) return;
    SET.sheets = SET.sheets.filter(s => s.id !== draft.id); if(S.sheetId === draft.id) S.sheetId = '';
    store('settings', SET); draft = SET.sheets[0] ? JSON.parse(JSON.stringify(SET.sheets[0])) : null; renderSettings(); });
}

// ---------- load the shared team roster (falls back to the built-in list if the database is slow or down) ----------
try {
  const got = await Promise.race([fetchSigners(), new Promise(res => setTimeout(() => res(null), 4000))]);
  ROSTER = got && Object.keys(got).length ? got : Object.assign({}, DEFAULT_SIGNERS);
} catch(e){ console.error('fetchSigners failed, using defaults:', e); ROSTER = Object.assign({}, DEFAULT_SIGNERS); }

// ---------- start ----------
const params = new URLSearchParams(location.search);
if(params.get('demo') === '1'){ S = asState(example()); S.example = true; }
else S = blank();
savedJSON = JSON.stringify(S);
renderInputs();
// The engine words this link for multi-lender use; RateSecure has one sheet, so reword it (text only).
const reword = () => { const b = document.getElementById('cs-managesheets'); if(b && b.textContent !== 'Edit RateSecure fees') b.textContent = 'Edit RateSecure fees'; };
reword(); new MutationObserver(reword).observe(ROOT, {childList:true, subtree:true});
})();
</script>
